name: build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Flet and Dependencies
        run: |
          pip install flet
          cd client
          pip install -r requirements.txt
          
      - name: Build APK
        run: cd client && flet build apk --module-name main
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: policy-daily-apk
          path: client/build/apk/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Flet and Dependencies
        run: |
          pip install flet
          cd client
          pip install -r requirements.txt
          
      - name: Build Windows
        run: cd client && flet build windows --module-name main
        
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: policy-daily-windows
          path: client/build/windows/*
