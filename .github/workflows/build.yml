name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # H3：仅 INTERNET。多一条即失败
      - name: aapt 权限检查
        working-directory: client/android
        run: |
          set -e
          if ls gradlew >/dev/null 2>&1; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          perms=$(aapt dump permissions "$APK" | awk '/uses-permission/ {print $2}' | sort)
          echo "$perms"
          test "$perms" = "android.permission.INTERNET"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打包 Windows exe
        working-directory: client/windows
        run: |
          python -m pip install --upgrade pip pyinstaller requests
          pyinstaller --clean --noconfirm --onefile --windowed --name PolicyDaily --paths .. app.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: client/windows/dist/PolicyDaily.exe
