# 部门 → default_category 兜底映射（段5 处理层）
# 用途：模型输出 category 非法/缺失时，按 item.source 命中部门，取该部门 default_category。
# 规则：source 字段包含 key（不区分大小写的子串匹配）即命中；自上而下第一个命中生效；
#       未命中任何部门 → 落 fallback_category（其他）。
# 枚举固定六类（00_CONSTRAINTS L13）：民生 / 经济金融 / 科技产业 / 安全国防 / 政务法治 / 其他

